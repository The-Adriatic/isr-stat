name: Kopije podatkov

on:
  schedule:
    - cron: "41 4 * * 2"   # vsak torek ob 4.41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build-snapshots.mjs"
      - ".github/workflows/snapshots.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-snapshots.mjs
      - name: Shrani kopije
        run: |
          git config user.name "isr-stat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Ni sprememb."; exit 0; fi
          git commit -m "Kopije podatkov: osvežitev"
          git pull --rebase origin main
          git push
      - name: Objavi stran
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
