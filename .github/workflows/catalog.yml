name: Katalog tabel

on:
  schedule:
    - cron: "17 3 * * 1"   # vsak ponedeljek ob 3.17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Viri (presledek med njimi), prazno = vsi"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tools/build-catalog.mjs"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock @xmldom/xmldom@0.8
      - run: node tools/build-catalog.mjs ${{ github.event.inputs.sources }}
      - name: Shrani katalog
        run: |
          git config user.name "isr-stat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then echo "Ni sprememb."; exit 0; fi
          git commit -m "Katalog tabel: osvežitev"
          git pull --rebase origin main
          git push
